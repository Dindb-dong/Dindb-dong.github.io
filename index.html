<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/dindbos-mark.png" />
    <meta
      name="description"
      content="김동욱의 포트폴리오를 DindbOS 런타임 위에서 파일, 앱, 터미널처럼 탐색합니다."
    />
    <title>DindbOS | Kim Dong Wook Portfolio</title>
    <style>
      html, body { margin: 0; background: #f5f7fc; }
      .portfolio-hello { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-content: center; justify-items: center; gap: 24px; background: #f5f7fc; color: #202124; font: 14px/1.6 system-ui, sans-serif; }
      .portfolio-hello svg { display: none; width: min(400px, 76vw); overflow: visible; }
      [data-hello="write"] .portfolio-hello svg { display: block; }
      .portfolio-hello path { stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: .999; animation: portfolio-hello-write 1600ms cubic-bezier(.35, 0, .25, 1) both; }
      .portfolio-hello.is-leaving { pointer-events: none; animation: portfolio-hello-exit 350ms ease both; }
      #startup-message { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .startup-recovery { display: none; }
      [data-hello="skip"] #startup-message, [data-recovery] #startup-message { position: static; width: auto; height: auto; overflow: visible; clip-path: none; margin: 0; max-width: 34ch; padding: 0 24px; text-align: center; }
      [data-recovery] .startup-recovery { display: flex; gap: 24px; }
      .portfolio-hello a { color: #2563eb; padding: 12px 0; }
      .portfolio-hello a:focus-visible { outline: 2px solid #2563eb; outline-offset: 4px; }
      @keyframes portfolio-hello-write { to { stroke-dashoffset: 0; } }
      @keyframes portfolio-hello-exit { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        [data-hello="write"] .portfolio-hello svg { display: none; }
        .portfolio-hello.is-leaving, .portfolio-hello path { animation: none; }
        #startup-message { position: static; width: auto; height: auto; overflow: visible; clip-path: none; margin: 0; max-width: 34ch; padding: 0 24px; text-align: center; }
      }
    </style>
    <script>
      (() => {
        const html = document.documentElement;
        html.dataset.helloStarted = performance.now();
        html.dataset.hello = "skip";
        try {
          const seen = localStorage.getItem("portfolio-hello-seen");
          localStorage.setItem("portfolio-hello-seen", "1");
          if (!seen && !matchMedia("(prefers-reduced-motion: reduce)").matches) html.dataset.hello = "write";
        } catch {}
        const earlyInput = new AbortController();
        const skip = () => { html.dataset.helloSkip = "true"; };
        window.addEventListener("pointerdown", skip, { capture: true, signal: earlyInput.signal });
        window.addEventListener("keydown", skip, { capture: true, signal: earlyInput.signal });
        document.addEventListener("portfolio-entry-ready", () => earlyInput.abort(), { once: true });
        // The entry module itself can stall, so recovery must start in the HTML.
        setTimeout(() => {
          const startup = document.getElementById("portfolio-startup");
          if (!startup || startup.hasAttribute("data-recovery")) return;
          startup.setAttribute("data-recovery", "");
          document.getElementById("startup-message").textContent = "Loading is taking longer than usual. You can retry or open the resume.";
        }, 15000);
      })();
    </script>
  </head>
  <body>
    <section id="portfolio-startup" class="portfolio-hello" aria-label="Loading portfolio" lang="en">
      <svg viewBox="0 0 404 126" fill="none" aria-hidden="true"><path pathLength="1" d="M12 94 C22 88 30 62 33 67 C37 73 18 106 32 103 C43 100 54 69 55 69 C53 79 47 106 59 103 C70 100 85 75 81 71 C76 68 76 84 90 84 C106 82 111 68 103 68 C91 66 83 87 91 98 C100 114 120 102 132 85 C147 61 165 17 151 17 C137 17 119 91 133 102 C143 110 156 99 166 84 C173 72 190 65 193 76 C181 61 160 80 169 97 C176 112 195 105 207 85 C213 68 230 66 233 79 C236 93 220 111 210 103 C198 92 211 71 228 74 C241 79 248 84 251 80 C254 75 262 63 263 70 L254 101 C263 80 280 62 283 72 C287 78 273 99 280 103 C288 99 302 69 311 70 C321 73 300 104 316 103 C326 102 337 88 345 82 C360 78 365 67 357 67 C345 67 335 86 344 98 C355 111 378 101 387 91"/></svg>
      <p id="startup-message" role="status">Loading portfolio…</p>
      <nav class="startup-recovery" aria-label="Loading recovery"><a href="">Try again</a><a href="/resume.html">Open resume</a></nav>
      <noscript><style>.portfolio-hello svg, #startup-message { display: none; }</style><p>JavaScript is required to open this portfolio.</p><a href="/resume.html">Open resume</a></noscript>
    </section>
    <main id="app" aria-label="DindbOS portfolio runtime" inert aria-busy="true"></main>
    <script type="module" src="/src/hello.js"></script>
  </body>
</html>
