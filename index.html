<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/dindbos-mark.png" />
    <meta
      name="description"
      content="김동욱의 포트폴리오를 DindbOS 런타임 위에서 파일, 앱, 터미널처럼 탐색합니다."
    />
    <title>DindbOS | Kim Dong Wook Portfolio</title>
    <style>
      html, body { margin: 0; background: #080b0b; }
      .portfolio-hello { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-content: center; justify-items: center; gap: 24px; background: #080b0b; color: #b6c6cb; font: 13px/1.8 ui-monospace, SFMono-Regular, Consolas, monospace; padding: 24px; }
      .boot-terminal { display: none; width: min(960px, calc(100vw - 48px)); }
      [data-hello="write"] .boot-terminal { display: block; }
      .boot-label { color: #748888; font-size: 11px; letter-spacing: .18em; margin: 0 0 32px; }
      .boot-output { height: 260px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
      #boot-log { margin: 0; padding: 0; list-style: none; color: #9baeb4; font-size: clamp(10px, 1.25vw, 13px); overflow-wrap: anywhere; }
      #boot-log li { animation: boot-line 120ms ease-out both; }
      #boot-log li:last-child { color: #c1dfce; }
      .boot-welcome { display: none; }
      .boot-welcome svg { display: block; width: 100%; height: auto; }
      #startup-enter { display: block; background: transparent; border: 0; color: #b6c6cb; padding: 16px 0; margin-top: 24px; font: inherit; font-size: clamp(15px, 1.4vw, 18px); cursor: pointer; text-align: left; }
      #startup-enter span { animation: boot-prompt 1.4s steps(1, end) infinite; }
      #startup-enter:focus-visible { outline: 1px solid #91baf0; outline-offset: 8px; }
      [data-phase="welcome"] .boot-output { display: none; }
      [data-phase="welcome"] .boot-welcome { display: block; }
      .portfolio-hello.is-leaving { pointer-events: none; animation: portfolio-hello-exit 300ms ease both; }
      #startup-message { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .startup-recovery { display: none; }
      [data-recovery] #startup-message { position: static; width: auto; height: auto; overflow: visible; clip-path: none; margin: 0; max-width: 40ch; text-align: center; }
      [data-recovery] .startup-recovery { display: flex; gap: 24px; }
      [data-recovery] .boot-terminal { display: none; }
      .portfolio-hello a { color: #91baf0; padding: 12px 0; }
      .portfolio-hello a:focus-visible { outline: 2px solid #91baf0; outline-offset: 4px; }
      @keyframes boot-prompt { 50% { opacity: .2; } }
      @keyframes boot-line { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes portfolio-hello-exit { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .portfolio-hello:not([data-phase="welcome"]) .boot-terminal { display: none; }
        .portfolio-hello.is-leaving, #boot-log li, #startup-enter span { animation: none; }
        .portfolio-hello:not([data-phase="welcome"]) #startup-message { position: static; width: auto; height: auto; overflow: visible; clip-path: none; margin: 0; max-width: 40ch; text-align: center; }
      }
    </style>
    <script>
      (() => {
        const html = document.documentElement;
        html.dataset.helloStarted = performance.now();
        html.dataset.hello = "write";
        // The entry module itself can stall, so recovery must start in the HTML.
        setTimeout(() => {
          const startup = document.getElementById("portfolio-startup");
          if (!startup || startup.hasAttribute("data-recovery") || startup.dataset.phase === "welcome" || startup.classList.contains("is-leaving")) return;
          startup.setAttribute("data-recovery", "");
          document.getElementById("startup-message").textContent = "Loading is taking longer than usual. You can retry or open the resume.";
        }, 15000);
      })();
    </script>
  </head>
