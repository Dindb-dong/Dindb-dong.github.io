name: Deploy DindbOS portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DINDBOS_REVISION: 84abc14feb2f7f3738d5f4f09e23c19d985f9f2e

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit and content checks
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Check out DindbOS showcase source
        uses: actions/checkout@v4
        with:
          repository: Dindb-dong/dindbos
          ref: ${{ env.DINDBOS_REVISION }}
          path: .dindbos-source
          persist-credentials: false

      - name: Build DindbOS showcase
        working-directory: .dindbos-source
        run: |
          npm ci
          npm run build
          git rev-parse HEAD > dist-demo/revision.txt

      - name: Include the showcase in the Pages artifact
        run: mv .dindbos-source/dist-demo dist/dindbos

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
